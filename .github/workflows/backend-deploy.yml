name: Deploy Backend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        working-directory: backend
        run: dotnet publish src/AliveMonitor.Api/AliveMonitor.Api.csproj --configuration Release --output ./publish

      - name: Upload to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          password: ${{ secrets.DROPLET_PASSWORD }}
          source: backend/publish/
          target: /tmp/alivemonitor-deploy
          strip_components: 2

      - name: Deploy and restart service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          password: ${{ secrets.DROPLET_PASSWORD }}
          envs: DATABASE_URL,JWT_SECRET
          script: |
            sudo systemctl stop alivemonitor || true
            sudo mkdir -p /opt/alivemonitor
            sudo rm -rf /opt/alivemonitor/*
            sudo mv /tmp/alivemonitor-deploy/* /opt/alivemonitor/
            sudo rm -rf /tmp/alivemonitor-deploy

            # Always recreate the service file to pick up secret changes
            sudo tee /etc/systemd/system/alivemonitor.service > /dev/null <<SERVICEEOF
            [Unit]
            Description=AliveMonitor API
            After=network.target

            [Service]
            WorkingDirectory=/opt/alivemonitor
            ExecStart=/opt/alivemonitor/AliveMonitor.Api
            Restart=always
            RestartSec=5
            SyslogIdentifier=alivemonitor
            Environment=ASPNETCORE_ENVIRONMENT=Production
            Environment=ASPNETCORE_URLS=http://0.0.0.0:5000
            Environment=DOTNET_PRINT_TELEMETRY_MESSAGE=false
            Environment=ConnectionStrings__alivemonitordb=${DATABASE_URL}
            Environment=Jwt__Secret=${JWT_SECRET}

            [Install]
            WantedBy=multi-user.target
            SERVICEEOF
            sudo systemctl daemon-reload
            sudo systemctl enable alivemonitor
            sudo systemctl start alivemonitor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
